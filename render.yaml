# Render Blueprint: free Docker web service + free managed PostgreSQL.
# Render → New → Blueprint → select this repository.
services:
  - type: web
    name: digital-business-card
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digital-card-db
          property: connectionString

databases:
  - name: digital-card-db
    plan: free
    databaseName: digital_card
